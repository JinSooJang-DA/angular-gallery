<div class="gallery-layout">
  <!-- 좌측 포스트 리스트 -->
  <section class="posts-column">
    @for (post of posts; track post.name) {
      <article class="post-card">
        <h2 class="post-title">{{ post.name }}</h2>
        <div class="image-box">
          <img [src]="post.img" [alt]="post.name" />
        </div>

        <!-- 하트 아이콘 및 좋아요 영역 -->
        <div class="like-container">
          <img 
            [src]="post.liked ? 'assets/heart-red.png' : 'assets/heart-black.png'" 
            [alt]="post.liked ? 'liked' : 'not liked'"
            class="heart-btn"
            (click)="toggleLike(post)" 
          />
          <span class="likes-count">{{ post.likes }} Likes</span>
        </div>
      </article>
    }
  </section>

  <!-- 우측 Subscribers 리스트 -->
  <aside class="subscribers-column">
    <h2 class="sub-title">Subscribers</h2>
    <ul class="sub-list">
      @for (sub of subscribers; track sub.name) {
        <li class="sub-item">
          <span class="sub-name">{{ sub.name }}</span>
          <span class="sub-status">{{ sub.following ? 'Folgt dir' : 'Folgt dir nicht' }}</span>
        </li>
      }
    </ul>
  </aside>
</div>
